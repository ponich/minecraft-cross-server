# Docker Compose configuration for NeoForge Minecraft Server

services:
  minecraft-server:
    build: .
    container_name: minecraft-neoforge-modded
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      - MODE=creative
      - EULA=TRUE
      - TYPE=NEOFORGE
      - VERSION=1.21.1
      - NEOFORGE_VERSION=21.1.187
      - MEMORY=6G
      - MAX_MEMORY=10G
      - INIT_MEMORY=4G
      - JVM_OPTS=-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1
      - ONLINE_MODE=TRUE
      - SERVER_NAME=Modded NeoForge Server
      - MOTD=Minecraft Server with 32 amazing mods!
      - DIFFICULTY=normal
      - MAX_PLAYERS=20
      - VIEW_DISTANCE=10
      - SIMULATION_DISTANCE=10
      - SPAWN_PROTECTION=16
      - PVP=true
      - ENFORCE_WHITELIST=false
      - LEVEL_TYPE=minecraft:normal
      - SEED=
      - GENERATE_STRUCTURES=true
      - ALLOW_NETHER=true
      - ALLOW_FLIGHT=false
      - ENABLE_COMMAND_BLOCK=false
      - ENABLE_QUERY=false
      - ENABLE_RCON=true
      - RCON_PASSWORD=${MINECRAFT_RCON_PASSWORD:-minecraft_backup_2024}
      - FORCE_GAMEMODE=false
      - HARDCORE=false
      - LEVEL_NAME=world
      - MAX_BUILD_HEIGHT=256
      - MAX_WORLD_SIZE=29999984
      - SNOOPER_ENABLED=true
      - USE_NATIVE_TRANSPORT=true
      - DEBUG=false
    volumes:
      - ./mods:/data/mods:ro
      - ./config:/data/config
      - ./world:/data/world
      - ./logs:/data/logs
      - minecraft-data:/data
    networks:
      - minecraft-network
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 5s
      retries: 3
      timeout: 10s

  # Automatic backup service - runs twice daily
  backup:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    restart: unless-stopped
    environment:
      # Backup schedule: twice daily at 06:00 and 18:00
      - BACKUP_INTERVAL=12h
      - INITIAL_DELAY=10m
      
      # Server connection
      - RCON_HOST=minecraft-server
      - RCON_PORT=25575
      - RCON_PASSWORD=${MINECRAFT_RCON_PASSWORD:-minecraft_backup_2024}
      
      # Backup settings
      - BACKUP_METHOD=tar
      - TAR_COMPRESS_METHOD=gzip
      - BACKUP_NAME=minecraft-backup
      - KEEP_BACKUPS=14
      - EXCLUDES=*.tmp,cache
      
      # Advanced settings
      - PAUSE_IF_NO_PLAYERS=false
      - BACKUP_FETCH_DEST_FILE=/data/world
      - TZ=Europe/Moscow
    volumes:
      # Source data to backup
      - ./world:/data/world:ro
      - ./config:/data/config:ro
      
      # Backup destination
      - ./backups:/backups
    networks:
      - minecraft-network
    depends_on:
      minecraft-server:
        condition: service_healthy

  # RCON Web Admin Interface
  rcon-web:
    image: itzg/rcon:latest
    container_name: minecraft-rcon-web
    restart: unless-stopped
    ports:
      - "4326:4326"
      - "4327:4327"
    environment:
      # Web admin credentials
      - RWA_USERNAME=admin
      - RWA_PASSWORD=${MINECRAFT_WEB_ADMIN_PASSWORD:-admin_change_me}
      - RWA_ADMIN=TRUE
      
      # RCON server connection
      - RWA_RCON_HOST=minecraft-server
      - RWA_RCON_PASSWORD=${MINECRAFT_RCON_PASSWORD:-minecraft_backup_2024}
    networks:
      - minecraft-network
    depends_on:
      minecraft-server:
        condition: service_healthy

networks:
  minecraft-network:
    driver: bridge

volumes:
  minecraft-data:
    driver: local 